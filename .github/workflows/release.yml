name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: odin build staticsitegenerator -o:speed -out:ssg-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: ssg-linux-amd64
          path: ssg-linux-amd64

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ssg-linux-amd64/ssg-linux-amd64
          generate_release_notes: true
